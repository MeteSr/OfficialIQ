name: Admin task

# One-off app-admin actions, run by hand from the Actions tab as the deploy
# identity (the canisters' app-level admin), so nobody needs icp-cli locally:
#
#   set-role        — grant a role, e.g. Coordinator (needed to create an
#                     association). `principal` is the official's principal,
#                     shown on their Me page.
#   set-push-relay  — register the push relay's own identity. Leave
#                     `principal` empty to use PUSH_RELAY_IDENTITY_PEM's
#                     principal; "none" clears it.
#   seed-content    — register the sports and load the officiating
#                     mechanics (frontend/scripts/seedData.mjs). Safe to
#                     re-run: questions are only added to an empty bank.
#   seed-ncaa       — import the NCAA men's basketball and football rule
#                     books: downloads the NCAA's PDFs, checks them against
#                     the pinned editions and word for word, then writes
#                     the rules, approved rulings, rule changes and points
#                     of emphasis (frontend/scripts/seed-ncaa.mjs). Safe to
#                     re-run.
#   generate-questions — make the question bank from the imported rules with
#                     the AI proxy (needs set-ai-config first): questions on
#                     each rule section and each approved ruling. Stops
#                     after `max_requests` AI requests; re-run to continue
#                     (finished sections are skipped).
#   set-video-config — store the Cloudflare Stream account for game clips
#                     (CLOUDFLARE_STREAM_TOKEN secret; CLOUDFLARE_ACCOUNT_ID
#                     and CLOUDFLARE_STREAM_CUSTOMER_CODE variables).
#   set-ai-config   — store the Anthropic key from the ANTHROPIC_API_KEY
#                     secret in ai_proxy (re-run to rotate it). The optional
#                     ANTHROPIC_MODEL variable overrides the model.
#
# Secrets on the chosen environment: ICP_IDENTITY_PEM, plus
# PUSH_RELAY_IDENTITY_PEM for set-push-relay and ANTHROPIC_API_KEY for
# set-ai-config.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: staging
        type: choice
        options: [staging, ic]
      task:
        description: "Task"
        required: true
        type: choice
        options: [set-role, set-push-relay, seed-content, seed-ncaa, generate-questions, set-ai-config, set-video-config]
      principal:
        description: "Principal (set-role: the official; set-push-relay: empty = the relay secret's principal, or none; unused otherwise)"
        required: false
        default: ""
        type: string
      max_requests:
        description: "AI requests (generate-questions only; about 5 questions each, or \"all\")"
        required: false
        default: "40"
        type: string
      role:
        description: "Role (set-role only)"
        required: false
        default: Coordinator
        type: choice
        options: [Coordinator, Official, Assessor, Admin]

concurrency:
  group: admin-task
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Holds the admin identity and runs the ref's own scripts: main only.
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment == 'ic' && 'production' || 'staging' }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      TASK: ${{ inputs.task }}
      PRINCIPAL: ${{ inputs.principal }}
      ROLE: ${{ inputs.role }}
      MAX_REQUESTS: ${{ inputs.max_requests }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install icp-cli, ic-wasm and mops
        run: bash scripts/install-icp.sh

      - name: Install frontend deps
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Install pdftotext
        if: inputs.task == 'seed-ncaa'
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Resolve the push relay principal
        if: inputs.task == 'set-push-relay' && inputs.principal == ''
        env:
          ICP_IDENTITY_PEM: ${{ secrets.PUSH_RELAY_IDENTITY_PEM }}
          ICP_IDENTITY_NAME: push-relay
        run: |
          if [ -z "$ICP_IDENTITY_PEM" ]; then
            echo "::error::PUSH_RELAY_IDENTITY_PEM is not set on this environment (docs/DEPLOYMENT.md)."
            exit 1
          fi
          bash scripts/import-identity.sh
          echo "RELAY_PRINCIPAL=$(icp identity principal)" >> "$GITHUB_ENV"

      - name: Import admin identity
        run: bash scripts/import-identity.sh
        env:
          ICP_IDENTITY_PEM: ${{ secrets.ICP_IDENTITY_PEM || secrets.DFX_IDENTITY_PEM }}

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ inputs.task == 'set-ai-config' && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_MODEL: ${{ inputs.task == 'set-ai-config' && vars.ANTHROPIC_MODEL || '' }}
          CLOUDFLARE_STREAM_TOKEN: ${{ inputs.task == 'set-video-config' && secrets.CLOUDFLARE_STREAM_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.task == 'set-video-config' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_STREAM_CUSTOMER_CODE: ${{ inputs.task == 'set-video-config' && vars.CLOUDFLARE_STREAM_CUSTOMER_CODE || '' }}
        run: |
          # Inputs arrive through env, never interpolated into the script.
          cd frontend
          case "$TASK" in
            seed-content)
              node scripts/seed-content.mjs "$ENVIRONMENT"
              exit 0
              ;;
            seed-ncaa)
              node scripts/seed-ncaa.mjs "$ENVIRONMENT"
              exit 0
              ;;
            generate-questions)
              if ! [[ "$MAX_REQUESTS" =~ ^([0-9]+|all)$ ]]; then
                echo "::error::max_requests must be a number or \"all\"."
                exit 1
              fi
              node --no-warnings scripts/generate-questions.mjs "$ENVIRONMENT" --max-requests "$MAX_REQUESTS"
              exit 0
              ;;
            set-video-config)
              if [ -z "$CLOUDFLARE_STREAM_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_STREAM_CUSTOMER_CODE" ]; then
                echo "::error::Set the CLOUDFLARE_STREAM_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_STREAM_CUSTOMER_CODE variables on this environment (docs/DEPLOYMENT.md, Video hosting)."
                exit 1
              fi
              node --no-warnings scripts/set-video-config.mjs "$ENVIRONMENT"
              exit 0
              ;;
            set-ai-config)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "::error::ANTHROPIC_API_KEY is not set on this environment (docs/DEPLOYMENT.md, Anthropic API key)."
                exit 1
              fi
              node scripts/set-ai-config.mjs "$ENVIRONMENT"
              exit 0
              ;;
          esac
          PRINCIPAL="${RELAY_PRINCIPAL:-$PRINCIPAL}"
          if ! [[ "$PRINCIPAL" =~ ^([a-z0-9]{5}-)+[a-z0-9]{1,5}$ || "$PRINCIPAL" == "none" ]]; then
            echo "::error::'$PRINCIPAL' is not a principal."
            exit 1
          fi
          if [ "$TASK" = "set-role" ]; then
            node scripts/admin.mjs "$ENVIRONMENT" set-role "$PRINCIPAL" "$ROLE"
          else
            node scripts/admin.mjs "$ENVIRONMENT" set-push-relay "$PRINCIPAL"
          fi
