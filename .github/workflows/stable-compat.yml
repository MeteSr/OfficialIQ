name: Stable Compatibility

# Blocks changes that would make a canister upgrade trap with
# "Memory-incompatible program upgrade" — recoverable only by a reinstall that
# deletes the canister's data — and Candid changes existing clients can't
# call. See scripts/ci/check-stable-compat.sh.
#
# Its own workflow (not ci.yml) so adding/removing the `allow-stable-break` /
# `allow-candid-break` labels re-runs just this check.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ["backend/**", "mops.toml", "mops.lock", "scripts/ci/check-stable-compat.sh", ".github/workflows/stable-compat.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "mops.toml", "mops.lock"]

permissions:
  contents: read

concurrency:
  group: stable-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable-compat:
    name: stable-compat-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch base commit
        id: base
        env:
          # PR: compare with the target branch. Push to main: with the previous head.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.base.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Install icp-cli, ic-wasm and mops
        if: steps.base.outputs.skip != 'true'
        run: bash scripts/install-icp.sh

      - name: Install Motoko dependencies
        if: steps.base.outputs.skip != 'true'
        run: mops install --locked

      - name: Check stable-memory compatibility
        if: steps.base.outputs.skip != 'true'
        env:
          ALLOW_STABLE_BREAK: ${{ contains(github.event.pull_request.labels.*.name, 'allow-stable-break') && '1' || '' }}
          ALLOW_CANDID_BREAK: ${{ contains(github.event.pull_request.labels.*.name, 'allow-candid-break') && '1' || '' }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: bash scripts/ci/check-stable-compat.sh "$BASE_SHA"
