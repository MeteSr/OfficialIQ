name: Backend CI

# Type-checks and builds every Motoko canister with the pinned toolchain
# (mops.toml / tools/package.json) on pull requests that touch the backend
# or the build config, so a moc/core/recipe bump that breaks the build is
# caught before it reaches staging.

on:
  pull_request:
    paths:
      - "backend/**"
      - "icp.yaml"
      - "mops.toml"
      - "mops.lock"
      - "tools/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install icp-cli, ic-wasm and mops
        run: bash scripts/install-icp.sh

      - name: Install Motoko dependencies
        run: if [ -f mops.lock ]; then mops install --locked; else mops install; fi

      - name: Type-check canisters
        run: mops check --no-lint

      - name: Build canisters
        run: icp build user content question exam ranking challenge ai_proxy mentorship association report
        env:
          DO_NOT_TRACK: "1"

  # One-off: commit the mops.lock this repo is missing (it can't be generated
  # on Windows — mops trips over NTFS file locks). Removed once the lock lands.
  lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install icp-cli, ic-wasm and mops
        run: bash scripts/install-icp.sh

      - name: Generate and commit mops.lock if missing
        run: |
          [ -f mops.lock ] && { echo "mops.lock already committed."; exit 0; }
          mops install
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mops.lock
          git commit -m "chore: add mops.lock"
          git push origin "HEAD:${{ github.head_ref }}"
