name: Deploy (production)

# Production is the "ic" network (real IC mainnet). Never automatic: run it
# from the Actions tab ("Run workflow" on main) once staging looks good, so a
# mainnet deploy is always a deliberate act, not a side effect of merging.
# Add required reviewers to the `production` environment for a second
# person's approval click.
#
# Every successful run tags the commit it deployed `mainnet-YYYYMMDD-HHMMSS`
# and publishes a GitHub release for it (what changed, plus each canister's
# module hash), so the last good version is always known for a rollback
# (docs/DEPLOYMENT.md → "Rolling back").
#
# Secrets on the `production` environment (docs/DEPLOYMENT.md):
#   ICP_IDENTITY_PEM  — PEM of the deploy identity, whose cycles-ledger balance
#                       pays for production (DFX_IDENTITY_PEM works too)
#   CI_PUSH_TOKEN     — optional PAT, as in deploy-staging.yml

on:
  workflow_dispatch:
    inputs:
      allow_upgrade_break:
        description: "Deploy even if upgrading from the deployed build breaks stable memory or Candid (a planned reinstall or interface break)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Pre-deploy test gate
    # Jobs here hold the mainnet controller identity and run the dispatched
    # ref's own scripts, so only main may be deployed.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  upgrade-gate:
    name: Upgrade from the deployed build
    # From the build running on mainnet (the newest mainnet-* tag) to this
    # commit. No environment and no secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install icp-cli, ic-wasm and mops
        run: bash scripts/install-icp.sh
      - name: Stable-memory and Candid check against the deployed build
        run: bash scripts/ci/upgrade-from-deployed.sh mainnet
        env:
          ALLOW_STABLE_BREAK: ${{ inputs.allow_upgrade_break && '1' || '' }}
          ALLOW_CANDID_BREAK: ${{ inputs.allow_upgrade_break && '1' || '' }}

  deploy:
    needs: [test, upgrade-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # mappings commit, mainnet-* tag, release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install icp-cli, ic-wasm and mops
        run: bash scripts/install-icp.sh

      - name: Import CI identity
        run: bash scripts/import-identity.sh
        env:
          ICP_IDENTITY_PEM: ${{ secrets.ICP_IDENTITY_PEM || secrets.DFX_IDENTITY_PEM }}

      - name: Deploy to production (ic)
        id: deploy
        run: bash scripts/deploy.sh ic

      - name: Commit canister ID mappings
        # Runs even when the deploy failed partway — see deploy-staging.yml.
        if: always() && steps.deploy.outcome != 'skipped'
        run: bash scripts/commit-canister-ids.sh main
        env:
          PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN || github.token }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"

      - name: Post-deploy smoke test
        # Before the tag, so a deploy that fails it is never a rollback target.
        run: bash scripts/smoke-deployed.sh ic

      - name: Post-deploy cycle health gate
        run: bash scripts/check-cycle-health.sh ic

      - name: Tag the release
        id: tag
        if: success()
        env:
          PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN || github.token }}
        run: |
          TAG="mainnet-$(date -u +%Y%m%d-%H%M%S)"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            tag -a "$TAG" "$GITHUB_SHA" -m "Mainnet deploy, run $GITHUB_RUN_ID"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
          echo "Deployed $GITHUB_SHA to mainnet, tagged $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish release notes
        # The merged PRs since the last mainnet deploy plus each canister's
        # module hash, so "what changed" and "which commit is this wasm" both
        # have an answer. A failure here doesn't fail the deploy.
        if: success() && steps.tag.outputs.tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_PUSH_TOKEN || github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bash scripts/ops/release-manifest.sh ic > release-manifest.tsv
          git fetch --quiet --depth=1 origin 'refs/tags/mainnet-*:refs/tags/mainnet-*' || true
          PREV=$(git tag -l 'mainnet-*' | grep -vx "$TAG" | sort -r | head -1 || true)
          {
            echo "Deployed to mainnet by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} from ${GITHUB_SHA}."
            echo
            echo "Rollback: docs/DEPLOYMENT.md → \"Rolling back\". Running canisters and module hashes are in release-manifest.tsv."
          } > notes.md
          gh release create "$TAG" release-manifest.tsv --title "$TAG" --notes-file notes.md --generate-notes \
            ${PREV:+--notes-start-tag "$PREV"} --verify-tag
