name: Deploy (production)

# Production is the "ic" network (real IC mainnet). Deliberately gated
# behind a version tag rather than every push to main, so a mainnet
# deploy is always a conscious act, not a side effect of merging.
# Also runs against the "environment: production" GitHub Environment —
# configure required reviewers on that environment in repo settings if
# you want a manual approval gate before this job runs.
#
# Requires repo secrets (none of this runs until they're set — see
# docs/DEPLOYMENT.md):
#   DFX_IDENTITY_PEM  — PEM-encoded identity with a funded production wallet

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dfx
        run: bash scripts/install-dfx.sh

      - name: Import CI identity
        run: bash scripts/import-identity.sh
        env:
          DFX_IDENTITY_PEM: ${{ secrets.DFX_IDENTITY_PEM }}

      - name: Deploy to production (ic)
        run: bash scripts/deploy.sh ic

      - name: Check canister_ids.json is up to date
        # Deliberately warn-only, not auto-committed: this job runs off a
        # tag (a detached ref), and pushing to main from a tag build is
        # riskier than it's worth for a file that should only ever change
        # on first deploy of a new canister. If this fails, pull the new
        # canister_ids.json and commit it via a normal PR.
        run: bash scripts/commit-canister-ids.sh main --warn-only || echo "::warning::canister_ids.json changed — see log above, commit it via a PR to main."
