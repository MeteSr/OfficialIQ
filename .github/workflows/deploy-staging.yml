name: Deploy (staging)

# Staging is a second canister set on IC mainnet (icp.yaml's "staging"
# environment) — ICP has no separate public testnet, so this is the closest
# real-network equivalent. Runs automatically on every push to main so
# staging always reflects the latest merged code.
#
# Requires repo secrets (none of this runs until they're set — see
# docs/DEPLOYMENT.md):
#   ICP_IDENTITY_PEM  — PEM-encoded identity whose cycles-ledger balance pays
#                       for staging (the old DFX_IDENTITY_PEM name works too)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "icp.yaml"
      - "mops.toml"
      - "mops.lock"
      - "tools/**"
      - "scripts/deploy.sh"
      - "scripts/check-cycles.sh"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit updated .icp/data/mappings

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install icp-cli, ic-wasm and mops
        run: bash scripts/install-icp.sh

      - name: Import CI identity
        run: bash scripts/import-identity.sh
        env:
          # DFX_IDENTITY_PEM still works (same key, same principal) until renamed.
          ICP_IDENTITY_PEM: ${{ secrets.ICP_IDENTITY_PEM || secrets.DFX_IDENTITY_PEM }}

      - name: Deploy to staging
        run: bash scripts/deploy.sh staging

      - name: Commit canister ID mappings if they changed
        run: bash scripts/commit-canister-ids.sh main
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
