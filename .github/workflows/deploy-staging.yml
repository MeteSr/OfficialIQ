name: Deploy (staging)

# Staging is a second canister set on IC mainnet (see dfx.json's "staging"
# network) — ICP has no separate public testnet, so this is the closest
# real-network equivalent. Deploys every commit on main once CI has passed on
# it, so staging always runs the latest merged code and is where each upgrade
# is exercised before production sees it.
#
# Secrets/variables on the `staging` environment (docs/DEPLOYMENT.md):
#   DFX_IDENTITY_PEM  — PEM of the staging deploy identity (required)
#   DFX_WALLET_ID     — that identity's staging cycles wallet (required on CI,
#                       which keeps no dfx state between runs)
#   CI_PUSH_TOKEN     — optional fine-grained PAT (Contents: read/write) for
#                       pushing canister_ids.json and the staging-* tag when
#                       main's branch protection blocks GITHUB_TOKEN
# Until DFX_IDENTITY_PEM is set the deploy job is skipped, not failed.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      allow_upgrade_break:
        description: "Deploy even if upgrading from the deployed build breaks stable memory (a planned reinstall)"
        required: false
        default: false
        type: boolean

# One staging deploy at a time. Queue, don't cancel, so a deploy is never
# killed halfway through an upgrade.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upgrade-gate:
    name: Upgrade from the deployed build
    # The upgrade this deploy is about to run: from the build running on
    # staging (the newest staging-* tag) to this commit. No secrets.
    # workflow_run only for a successful CI *push* run in this repo: the
    # branches filter matches head_branch, so without the event/repo check a
    # fork PR from a branch named main would trigger a deploy.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out main's tip by default, which may be newer
          # than the commit CI passed on. Deploy exactly that commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install dfx
        run: bash scripts/install-dfx.sh
      - name: Stable-memory check against the deployed build
        run: bash scripts/ci/upgrade-from-deployed.sh staging
        env:
          ALLOW_STABLE_BREAK: ${{ inputs.allow_upgrade_break && '1' || '' }}

  deploy:
    needs: upgrade-gate
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write   # canister_ids.json commit + staging-* tag (when CI_PUSH_TOKEN is unset)
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HAS_IDENTITY: ${{ secrets.DFX_IDENTITY_PEM != '' }}
    steps:
      - name: Skip until the deploy identity is configured
        if: env.HAS_IDENTITY != 'true'
        run: echo "::notice::DFX_IDENTITY_PEM is not set on the staging environment — skipping (docs/DEPLOYMENT.md)."

      # persist-credentials: false keeps any token out of .git/config while
      # npm install and deploy.sh run; the push token is only handed to the
      # steps that push.
      - uses: actions/checkout@v4
        if: env.HAS_IDENTITY == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: env.HAS_IDENTITY == 'true'
        with:
          node-version: "22"

      - name: Install dfx
        if: env.HAS_IDENTITY == 'true'
        run: bash scripts/install-dfx.sh

      - name: Import CI identity
        if: env.HAS_IDENTITY == 'true'
        run: bash scripts/import-identity.sh
        env:
          DFX_IDENTITY_PEM: ${{ secrets.DFX_IDENTITY_PEM }}
          DFX_WALLET_ID: ${{ secrets.DFX_WALLET_ID || vars.DFX_WALLET_ID }}
          DFX_WALLET_NETWORK: staging

      - name: Deploy to staging
        # Runs the wallet pre-flight first, snapshots each canister before
        # upgrading it, and tops up low canisters afterwards (scripts/deploy.sh).
        id: deploy
        if: env.HAS_IDENTITY == 'true'
        run: bash scripts/deploy.sh staging

      - name: Commit canister IDs
        # Must run even when the deploy failed partway: a created canister is
        # real and paid for, and an uncommitted ID means the next deploy
        # creates (and pays for) another one.
        if: always() && env.HAS_IDENTITY == 'true' && steps.deploy.outcome != 'skipped'
        run: bash scripts/commit-canister-ids.sh main
        env:
          PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN || github.token }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"

      - name: Post-deploy smoke test
        # Every canister running, every backend answering metrics(), the
        # frontend serving the app.
        if: env.HAS_IDENTITY == 'true'
        run: bash scripts/smoke-deployed.sh staging

      - name: Post-deploy cycle health gate
        # Fails the deploy if any canister is within 30 days of its freezing
        # threshold, or its balance can't be read.
        if: env.HAS_IDENTITY == 'true'
        run: bash scripts/check-cycle-health.sh staging

      - name: Tag the deployed commit
        # The next deploy's upgrade gate compares against this build. Only
        # after the smoke test, so a broken deploy is never the baseline.
        if: success() && env.HAS_IDENTITY == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN || github.token }}
        run: |
          TAG="staging-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$TAG" "$DEPLOY_SHA"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
          echo "Deployed $DEPLOY_SHA to staging, tagged $TAG" >> "$GITHUB_STEP_SUMMARY"
