name: Push relay (streak milestones)

# Runs scripts/send-push.sh on a schedule so streak-milestone Web Push
# notifications actually go out in production — see BUSINESS.md #7, which
# tracks the *hosting decision* for this; this workflow is the "make it
# deployable once that's decided" half from issue #33. A scheduled GitHub
# Actions workflow is one valid answer to that hosting decision on its own;
# swap this out if a different always-on host is chosen instead.
#
# Requires secrets on the `production` environment (the job skips until
# PUSH_RELAY_IDENTITY_PEM is set — see docs/DEPLOYMENT.md):
#   PUSH_RELAY_IDENTITY_PEM — PEM of a dedicated relay identity, registered
#                        with the "Admin task" workflow (set-push-relay). It
#                        can only read push subscriptions and pending streak
#                        events. Never the deploy key: that one controls
#                        every canister.
#   VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY, VAPID_SUBJECT — from
#     `npx --prefix frontend web-push generate-vapid-keys` (the website)
#   APNS_KEY_P8, APNS_KEY_ID — an APNs key from the Apple Developer account,
#     with the APPLE_TEAM_ID variable (the iOS app)
#   FCM_SERVICE_ACCOUNT_JSON — a Firebase service account (the Android app)
# Each channel is optional; one without its secrets is skipped
# (docs/MOBILE.md, "Push notifications").

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    environment: production
    # Holds a production identity and runs the ref's own scripts, so only
    # main may run it (a manual dispatch could otherwise pick any branch).
    if: github.ref == 'refs/heads/main'
    env:
      HAS_RELAY_IDENTITY: ${{ secrets.PUSH_RELAY_IDENTITY_PEM != '' }}
    steps:
      - name: Skip until the relay identity is configured
        if: env.HAS_RELAY_IDENTITY != 'true'
        run: echo "::notice::PUSH_RELAY_IDENTITY_PEM is not set on the production environment — skipping (docs/DEPLOYMENT.md)."

      - uses: actions/checkout@v7
        if: env.HAS_RELAY_IDENTITY == 'true'

      - uses: actions/setup-node@v7
        if: env.HAS_RELAY_IDENTITY == 'true'
        with:
          node-version: "22"

      - name: Install icp-cli, ic-wasm and mops
        if: env.HAS_RELAY_IDENTITY == 'true'
        run: bash scripts/install-icp.sh

      - name: Import push relay identity
        if: env.HAS_RELAY_IDENTITY == 'true'
        run: bash scripts/import-identity.sh
        env:
          ICP_IDENTITY_PEM: ${{ secrets.PUSH_RELAY_IDENTITY_PEM }}

      # `npm ci`, not `npm install`: installs exactly what package-lock.json
      # pins, so a newly published (or compromised) package version can't run
      # its install scripts next to the production identity.
      - name: Install frontend deps
        if: env.HAS_RELAY_IDENTITY == 'true'
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Send pending pushes
        if: env.HAS_RELAY_IDENTITY == 'true'
        run: bash scripts/send-push.sh ic
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
