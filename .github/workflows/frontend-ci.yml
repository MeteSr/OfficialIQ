name: Frontend CI

# Runs the frontend unit tests and a production bundle on every pull request
# that touches the frontend. The deploy workflows only run after merge, so
# without this a broken frontend change isn't caught until staging.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      # `npm run build` also runs `tsc`, which currently fails on unrelated
      # unused-variable errors in MePage / RuleAssistantPage /
      # ScenarioGeneratorPage. Bundle with Vite directly until those are
      # cleaned up, then switch this step to `npm run build`.
      - name: Build
        run: npx vite build
