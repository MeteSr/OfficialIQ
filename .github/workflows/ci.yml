name: CI

# The gate everything else waits on: frontend unit tests + bundle, and every
# backend canister type-checking and building. Runs on pull requests, on every push to main
# (deploy-staging.yml deploys only after this passes there), and as the
# pre-deploy test gate of deploy-production.yml (workflow_call).

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  # workflow_call runs inherit the caller's ref; give them their own group so a
  # production deploy's test gate never cancels (or is cancelled by) a push run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      # `npm run build` is `tsc && vite build`, so type errors fail CI.
      - name: Type-check + build
        run: npm run build

  backend:
    name: Backend canisters build
    # Type-checks and builds every Motoko canister with the pinned toolchain
    # (mops.toml / tools/package.json), so a moc/core/recipe bump that breaks
    # the build is caught before it reaches staging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install icp-cli, ic-wasm and mops
        run: bash scripts/install-icp.sh

      - name: Install Motoko dependencies
        run: mops install --locked

      - name: Type-check canisters
        run: mops check --no-lint

      # Pure Motoko logic in backend/lib (test/*.test.mo).
      - name: Motoko unit tests
        run: mops test

      # backend/*/*.did and frontend/src/declarations are generated from the
      # canisters; fail when someone changed an interface without
      # regenerating them (the diff in the log is the fix).
      - name: Generated Candid and bindings are current
        run: bash scripts/ci/check-declarations.sh

      - name: Build canisters
        run: |
          source scripts/lib/canisters.sh
          icp build "${BACKEND_CANISTERS[@]}"
        env:
          DO_NOT_TRACK: "1"

  canister-tests:
    name: Canister integration tests
    # Deploys every backend canister to a local icp network and drives them
    # through the app's own IDL (frontend/src/integration): graded sessions,
    # ranking claims, challenges, association completions, the per-user
    # indexes. These are the tests that guard the grading logic.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install icp-cli, ic-wasm and mops
        run: bash scripts/install-icp.sh

      - name: Install Motoko dependencies
        run: mops install --locked

      - name: Start a local network and deploy the backend
        run: |
          source scripts/lib/canisters.sh
          icp network start -d
          icp deploy "${BACKEND_CANISTERS[@]}" -e local
        env:
          DO_NOT_TRACK: "1"
          # The network launcher is fetched from GitHub releases; an
          # authenticated request avoids the shared runners' API rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Integration tests
        working-directory: frontend
        run: npm run test:integration

      - name: Stop the local network
        if: always()
        run: icp network stop || true
